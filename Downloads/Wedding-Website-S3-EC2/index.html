<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Wedding Gallery</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* Modern Reset & CSS Variables */
        :root {
            --primary: #d63384;
            --primary-light: #fbeef3;
            --dark: #2c2c2c;
            --bg-gradient: linear-gradient(135deg, #fff5f7 0%, #fcedf2 100%);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            color: var(--dark);
            min-height: 100vh;
            padding: 3rem 1.5rem;
        }

        /* Header Styling */
        header {
            margin-bottom: 4rem;
            text-align: center;
        }

        .subtitle {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            color: var(--dark);
            font-weight: 700;
            position: relative;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        /* Decorative divider under title */
        h1::after {
            content: "♥";
            font-size: 1.2rem;
            color: var(--primary);
            position: absolute;
            bottom: -1.5rem;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
        }

        /* Responsive Grid System */
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        /* Gallery Item & Overlay Animations */
        .gallery-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            box-shadow: 0 10px 30px rgba(214, 51, 132, 0.08);
            cursor: pointer;
            background-color: #fff;
            transition: var(--transition);
        }

        .gallery-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(214, 51, 132, 0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        /* Hover Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.1) 100%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: var(--transition);
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        .overlay span {
            color: #fff;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 1px;
            transform: translateY(15px);
            transition: var(--transition);
        }

        .gallery-item:hover .overlay span {
            transform: translateY(0);
        }

        /* Lightbox Modal (Interactive Pop-up) */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: all;
        }

        .lightbox-img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .lightbox.active .lightbox-img {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 2.5rem;
            font-weight: 300;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }

        .close-btn:hover {
            color: var(--primary);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <header>
        <p class="subtitle">Capturing our magical moments</p>
        <h1>Our Wedding Gallery</h1>
    </header>

    <div class="gallery-container">
        <section class="gallery">
            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="https://harshada-wedding-gallery.s3.ap-south-1.amazonaws.com/wedding1.jpg" alt="Wedding Moment 1">
                <div class="overlay">
                    <span>View Moment</span>
                </div>
            </div>
            
            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="https://harshada-wedding-gallery.s3.ap-south-1.amazonaws.com/wedding2.jpg" alt="Wedding Moment 2">
                <div class="overlay">
                    <span>View Moment</span>
                </div>
            </div>

            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="https://harshada-wedding-gallery.s3.ap-south-1.amazonaws.com/wedding3.jpg" alt="Wedding Moment 3">
                <div class="overlay">
                    <span>View Moment</span>
                </div>
            </div>

            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="https://harshada-wedding-gallery.s3.ap-south-1.amazonaws.com/wedding4.jpg" alt="Wedding Moment 4">
                <div class="overlay">
                    <span>View Moment</span>
                </div>
            </div>

            <div class="gallery-item" onclick="openLightbox(this)">
                <img src="https://harshada-wedding-gallery.s3.ap-south-1.amazonaws.com/wedding5.jpg" alt="Wedding Moment 5">
                <div class="overlay">
                    <span>View Moment</span>
                </div>
            </div>
        </section>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img class="lightbox-img" id="lightbox-img" src="" alt="Enlarged View">
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(element) {
            const imgSrc = element.querySelector('img').src;
            lightboxImg.src = imgSrc;
            lightbox.classList.add('active');
            // Disable background scrolling while viewing photo
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            // Enable background scrolling again
            document.body.style.overflow = 'auto';
        }

        // Close lightbox if ESC key is pressed
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>

</body>
</html>
