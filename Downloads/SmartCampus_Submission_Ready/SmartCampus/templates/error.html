{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center py-20">
  <p class="text-6xl font-black text-brand-200">{{ code }}</p>
  <h1 class="text-xl font-bold text-slate-800 mt-3">{{ message }}</h1>
  <a href="{{ url_for('index') }}" class="inline-block mt-6 px-6 py-3 rounded-lg bg-brand-600 text-white font-semibold hover:bg-brand-700 transition">
    Go Home
  </a>
</div>
{% endblock %}
