{% extends "base.html" %}
{% block title %}Manage Branches{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
  <div><h1 class="text-2xl font-extrabold">Branch Management</h1><p class="text-sm text-slate-500">Add, activate or deactivate branches.</p></div>
</div>
<form method="POST" class="bg-white rounded-xl border p-5 flex gap-3 mb-6">
  <input name="name" required placeholder="e.g. Artificial Intelligence & Machine Learning" class="flex-1 rounded-lg border px-3 py-2">
  <button class="bg-brand-600 text-white rounded-lg px-5 py-2 font-semibold">Add Branch</button>
</form>
<div class="bg-white rounded-xl border overflow-hidden">
<table class="min-w-full text-sm"><thead class="bg-slate-50"><tr><th class="text-left px-4 py-3">Branch</th><th class="text-left px-4 py-3">Status</th><th class="text-right px-4 py-3">Action</th></tr></thead>
<tbody class="divide-y">{% for b in branches %}<tr><td class="px-4 py-3 font-medium">{{ b.name }}</td><td class="px-4 py-3">{% if b.active %}<span class="text-emerald-700">Active</span>{% else %}<span class="text-red-600">Inactive</span>{% endif %}</td><td class="px-4 py-3 text-right"><form method="POST" action="{{ url_for('admin_toggle_branch', branch_id=b.id) }}"><button class="font-semibold {% if b.active %}text-red-600{% else %}text-emerald-600{% endif %}">{% if b.active %}Deactivate{% else %}Activate{% endif %}</button></form></td></tr>{% endfor %}</tbody>
</table></div>
{% endblock %}
