{% extends "base.html" %}
{% block title %}Website Settings{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-2xl border card-shadow p-8">
<h1 class="text-2xl font-extrabold">Website Settings</h1>
<p class="text-sm text-slate-500 mt-1 mb-6">Change the visible project name and tagline without editing code.</p>
<form method="POST" class="space-y-5">
<div><label class="text-sm font-semibold">Website / Project Name</label><input name="site_name" value="{{ settings.site_name or 'Smart Campus' }}" required class="mt-1 w-full rounded-lg border px-3 py-2"></div>
<div><label class="text-sm font-semibold">Tagline</label><input name="tagline" value="{{ settings.tagline or 'Academic Resource Portal' }}" required class="mt-1 w-full rounded-lg border px-3 py-2"></div>
<button class="w-full rounded-lg bg-brand-600 text-white py-3 font-semibold">Save Settings</button>
</form>
</div>
{% endblock %}
