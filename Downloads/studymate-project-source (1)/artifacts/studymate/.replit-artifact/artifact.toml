kind = "web"
previewPath = "/"
title = "StudyMate"
description = "A full-stack academic assistance platform for R. C. Patel Institute of Technology students, combining resources, aptitude practice, AI study support, and administrator tools."
version = "1.0.0"
id = "artifacts/studymate"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24152

[services.development]
run = "pnpm --filter @workspace/studymate run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/studymate", "run", "build" ]
serve = "static"
publicDir = "artifacts/studymate/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24152"
BASE_PATH = "/"
