<!DOCTYPE html>
<html>
<head>
    <title>Wildlife Monitoring System</title>

    <style>

        body{
            font-family: Arial;
            text-align:center;
            background:#f4f4f4;
            margin:40px;
        }

        h1{
            color:green;
        }

        button{
            padding:10px 20px;
            margin-top:10px;
            cursor:pointer;
        }

        table{
            width:90%;
            margin:auto;
            margin-top:30px;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid black;
            padding:10px;
        }

        th{
            background:green;
            color:white;
        }

        img{
            width:120px;
        }

    </style>

</head>

<body>

<h1>Wildlife Monitoring System</h1>

<input type="file" id="imageInput">

<br><br>

<button onclick="uploadImage()">Upload Image</button>

<h3 id="message"></h3>

<hr>

<h2>Detected Animals</h2>

<button onclick="loadAnimals()">Refresh Dashboard</button>

<table>

<thead>

<tr>

<th>Animal</th>

<th>Detection Count</th>

<th>Confidence</th>

<th>Last Seen</th>

<th>Image</th>

</tr>

</thead>

<tbody id="animalTable">

</tbody>

</table>

<script src="script.js"></script>

</body>
</html>
