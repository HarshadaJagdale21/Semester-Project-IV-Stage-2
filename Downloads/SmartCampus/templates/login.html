{% extends "base.html" %}
{% block title %}Student Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl card-shadow border border-slate-100 p-8">
  <h1 class="text-2xl font-extrabold text-slate-900">Student Login</h1>
  <p class="text-slate-500 text-sm mt-1">{{ college_name }}</p>

  <form method="POST" class="mt-6 space-y-4">
    <div>
      <label class="text-sm font-medium text-slate-700">Email</label>
      <input type="email" name="email" required autofocus
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
    </div>
    <div>
      <label class="text-sm font-medium text-slate-700">Password</label>
      <input type="password" name="password" required
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
    </div>
    <div class="flex items-center justify-between text-sm">
      <label class="flex items-center gap-2 text-slate-600">
        <input type="checkbox" checked class="rounded border-slate-300"> Remember me
      </label>
      <a href="#" class="text-brand-700 hover:underline">Forgot password?</a>
    </div>
    <button type="submit" class="w-full py-3 rounded-lg bg-brand-600 text-white font-semibold hover:bg-brand-700 transition">
      Log In
    </button>
  </form>

  <p class="text-sm text-slate-500 mt-4 text-center">
    New here? <a href="{{ url_for('register') }}" class="text-brand-700 font-medium hover:underline">Create an account</a>
  </p>
</div>
{% endblock %}
