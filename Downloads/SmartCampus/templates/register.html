{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-2xl card-shadow border border-slate-100 p-8">
  <h1 class="text-2xl font-extrabold text-slate-900">Create your Student Account</h1>
  <p class="text-slate-500 text-sm mt-1">{{ college_name }}</p>

  <form method="POST" class="mt-6 space-y-4">
    <div class="grid sm:grid-cols-2 gap-4">
      <div>
        <label class="text-sm font-medium text-slate-700">Full Name</label>
        <input type="text" name="name" required value="{{ form.name or '' }}"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Enrollment Number</label>
        <input type="text" name="enrollment_no" value="{{ form.enrollment_no or '' }}"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
      </div>
    </div>

    <div>
      <label class="text-sm font-medium text-slate-700">Email</label>
      <input type="email" name="email" required value="{{ form.email or '' }}"
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
    </div>

    <div class="grid sm:grid-cols-2 gap-4">
      <div>
        <label class="text-sm font-medium text-slate-700">Password</label>
        <input type="password" name="password" required minlength="6"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Confirm Password</label>
        <input type="password" name="confirm_password" required minlength="6"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
      </div>
    </div>

    <div>
      <label class="text-sm font-medium text-slate-700">Branch</label>
      <select name="branch" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
        <option value="">Select branch</option>
        {% for b in branches %}
          <option value="{{ b }}" {% if form.branch == b %}selected{% endif %}>{{ b }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="grid sm:grid-cols-2 gap-4">
      <div>
        <label class="text-sm font-medium text-slate-700">Year</label>
        <select name="year" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
          <option value="">Select year</option>
          {% for y in years %}
            <option value="{{ y }}" {% if form.year == y %}selected{% endif %}>{{ y }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Semester</label>
        <select name="semester" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
          <option value="">Select semester</option>
          {% for s in semesters %}
            <option value="{{ s }}" {% if form.semester == s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <button type="submit" class="w-full py-3 rounded-lg bg-brand-600 text-white font-semibold hover:bg-brand-700 transition">
      Create Account
    </button>
  </form>

  <p class="text-sm text-slate-500 mt-4 text-center">
    Already have an account? <a href="{{ url_for('student_login') }}" class="text-brand-700 font-medium hover:underline">Log in</a>
  </p>
</div>
{% endblock %}
