{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-900 text-white rounded-2xl card-shadow p-8">
  <div class="flex items-center gap-2 mb-2">
    <span class="bg-brand-500 rounded-lg w-8 h-8 flex items-center justify-center font-black text-sm">A</span>
    <h1 class="text-2xl font-extrabold">Admin Portal</h1>
  </div>
  <p class="text-slate-400 text-sm mb-6">Restricted access &mdash; {{ college_name }}</p>

  <form method="POST" class="space-y-4">
    <div>
      <label class="text-sm font-medium text-slate-300">Admin Email</label>
      <input type="email" name="email" required autofocus
             class="mt-1 w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 text-white focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
    </div>
    <div>
      <label class="text-sm font-medium text-slate-300">Password</label>
      <input type="password" name="password" required
             class="mt-1 w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 text-white focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
    </div>
    <button type="submit" class="w-full py-3 rounded-lg bg-brand-500 hover:bg-brand-600 transition font-semibold">
      Secure Login
    </button>
  </form>
  <p class="text-xs text-slate-500 mt-6 text-center">
    Admin accounts are created via <code class="bg-slate-800 px-1 rounded">seed_admin.py</code> only.
  </p>
</div>
{% endblock %}
