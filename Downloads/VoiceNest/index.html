<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceNest - Smart House Finder</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background-glow"></div>

<div class="container">
    
    <!-- App Header -->
    <header class="app-header">
        <div class="logo-icon">
            <i class="fa-solid fa-house-signal"></i>
        </div>
        <h1>VoiceNest</h1>
        <p class="tagline">Smart Voice-Assisted House Finder</p>
    </header>

    <!-- Voice Control Center -->
    <div class="voice-section">
        <button id="startBtn" class="mic-button">
            <span class="mic-icon-wrapper">
                <i class="fa-solid fa-microphone"></i>
            </span>
            <span class="pulse-ring"></span>
        </button>
        <span class="status-indicator" id="statusText">Tap microphone to start searching</span>

        <!-- Audio Wave Visualizer Animation -->
        <div class="visualizer" id="visualizer">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </div>

    <!-- Voice Input Box -->
    <div class="input-card">
        <div class="card-title">
            <i class="fa-solid fa-quote-left"></i>
            <h3>Detected Speech</h3>
        </div>
        <textarea id="voiceText" rows="3" placeholder="Your spoken query will appear here..." readonly></textarea>
    </div>

    <!-- Results Display -->
    <div class="results-section">
        <div class="card-title">
            <i class="fa-solid fa-compass"></i>
            <h3>Matching Houses</h3>
        </div>
        
        <div id="results" class="results-grid">
            <div class="empty-state">
                <i class="fa-solid fa-waveform-lines"></i>
                <p>No houses searched yet. Press the mic button and say something like <em>"Find a 2 BHK apartment in Mumbai"</em>.</p>
            </div>
        </div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
